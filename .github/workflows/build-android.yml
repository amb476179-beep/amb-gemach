# בניית אפליקציית אנדרואיד (APK) של AMB גמ"ח – בכל שינוי בתיקיית android, או ידנית מלשונית Actions
name: Build Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AMB-Gemach.apk
          gh release create "android-${{ github.run_number }}" AMB-Gemach.apk --title "אפליקציית אנדרואיד – גרסה ${{ github.run_number }}" --notes "קובץ ההתקנה: AMB-Gemach.apk" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: AMB-Gemach-apk
          path: AMB-Gemach.apk
