<style>

</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),mem={};
const ld=k=>{try{const v=localStorage.getItem(k);if(v!=null)return JSON.parse(v)}catch(e){}return mem[k]??null};
const sv=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let U=null,D=null,DK=null,view='dash',sel=null,comb=false,bk=null,PERM='full';
const VER='3.0';
function save(){if(PERM=='view'){alert('יש לך הרשאת צפייה בלבד – השינוי לא נשמר');D=ld('amb_d_'+DK)||D;return false}checkClosed();sv('amb_d_'+DK,D);srvSave();return true}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=n=>'₪'+Math.round(n||0).toLocaleString('he-IL');
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const addM=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x.toISOString().slice(0,10)};
const L=id=>D.loans.find(l=>l.id==id);
const paid=l=>(l.pays||[]).filter(p=>!p.ret).reduce((a,p)=>a+ +p.amount,0);
const inst=l=>l.n?l.amount/l.n:0;
const endD=l=>l.start&&l.n?addM(l.start,+l.n):'';
const name=l=>esc(l.first+' '+l.last)+(l.childName?' (חתונת '+esc(l.childName)+')':'');
function due(l){if(!l.start)return 0;const s=new Date(l.start),t=new Date();let m=(t.getFullYear()-s.getFullYear())*12+t.getMonth()-s.getMonth();if(t.getDate()<(l.day||1))m--;return Math.max(0,Math.min(+l.n,m))}
const late=l=>paid(l)+1<due(l)*inst(l)-1&&paid(l)<l.amount;
const lateAmt=l=>Math.max(0,due(l)*inst(l)-paid(l));
const active=l=>paid(l)<+l.amount-1;
const color=p=>p<34?'var(--er)':p<67?'var(--wn)':'var(--ok)';
function donut(a,b){const p=b?Math.min(100,a/b*100):0,r=60,c=2*Math.PI*r;
return `<svg viewBox="0 0 160 160" width="190" style="max-width:100%"><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--ln)" stroke-width="16"/><circle cx="80" cy="80" r="${r}" fill="none" stroke="${color(p)}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 80 80)"/><text x="80" y="70" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">${Math.round(p)}%</text><text x="80" y="90" text-anchor="middle" font-size="11" fill="currentColor">שולם ${fm(a)}</text><text x="80" y="106" text-anchor="middle" font-size="11" fill="currentColor">נותר ${fm(b-a)}</text></svg>`}

/* ---------- העדפות תצוגה ונגישות (לכל מכשיר) ---------- */
const PDEF={theme:'auto',fs:100,br:100,hc:false,nm:false,ul:false,big:false,alo:0};
let P={...PDEF,...(ld('amb_pref')||{})};
function applyP(){const h=document.documentElement;if(P.theme=='auto')h.removeAttribute('data-theme');else h.dataset.theme=P.theme;h.style.fontSize=P.fs+'%';h.style.setProperty('--br',P.br/100);
h.classList.toggle('dim',P.br!=100);['hc','nm','ul','big'].forEach(k=>h.classList.toggle(k,!!P[k]))}
function setP(k,v){P[k]=v;sv('amb_pref',P);applyP();const o=$('#pv_'+k);if(o)o.textContent=v+'%';if(k=='alo')idle()}
applyP();
let IT=null;function idle(){clearTimeout(IT);if(U&&+P.alo>0)IT=setTimeout(()=>{if(U){logout();loginV('נותקת אוטומטית לאחר חוסר פעילות')}},P.alo*60000)}
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,idle,{passive:true}));

/* ---------- כניסה ובעלים ---------- */
let ROLE=null,IMP=false,OWNU=null;
const hs=s=>{let h=5381;for(const c of s)h=h*33^c.charCodeAt(0);return String(h>>>0)};
const US=()=>{const u=ld('amb_users')||{};for(const k in u)if(typeof u[k]=='string')u[k]={h:u[k],role:'gemach',gname:k};return u};
const hasOwner=()=>Object.values(US()).some(x=>x.role=='owner');
const okU=u=>/^[^'"<>\s]+$/.test(u);
const defD=g=>({gname:g,base:0,loans:[],lastSel:[],tasks:[]});
const ME=()=>IMP?OWNU:U;
const canAdmin=()=>!!D&&(ROLE=='gemach'||IMP||(ROLE=='sub'&&PERM=='full'));
const PERMS={full:'מנהל מלא',edit:'עריכה (ללא הגדרות)',view:'צפייה בלבד'};
function loginV(msg){if(SRV)return srvLoginV(msg);U=null;supUnmount();document.documentElement.style.removeProperty('--pr');document.documentElement.style.removeProperty('--pr2');const no=!hasOwner()&&CANOWN,none=!Object.keys(US()).length;
$('#app').innerHTML=`<div id="login" class="card"><h2>AMB מערכות</h2><p style="color:var(--mu);margin-top:-8px">${no?'הגדרה ראשונית – יצירת חשבון מנהל מערכת':'ניהול גמ״ח – כניסה'}</p><label for="u">שם משתמש</label><input id="u" autocomplete="username" autocapitalize="off"><label for="p" style="margin-top:8px">סיסמה</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')${no?'setupOwner()':'login()'}"><p style="color:var(--er)" role="alert">${esc(msg||'')}</p><div class="bar"><button onclick="${no?'setupOwner()':'login()'}">${no?'יצירת חשבון מנהל':'כניסה'}</button></div>
<small style="color:var(--mu)">הנתונים נשמרים במכשיר זה.</small>${typeof APP!='undefined'&&APP&&!standalone()?'<p><button class="g" onclick="installApp()">📱 התקנה כאפליקציה</button></p>':''}</div>`}
function login(){const us=US(),u=$('#u').value.trim().toLowerCase();if(us[u]&&us[u].h==hs($('#p').value))start(u);else loginV('פרטי כניסה שגויים')}
function setupOwner(){if(!CANOWN)return loginV();const u=$('#u').value.trim().toLowerCase(),p=$('#p').value;if(!okU(u)||p.length<4)return loginV('נא למלא שם משתמש (ללא רווחים) וסיסמה של 4 תווים לפחות');const us=US();if(us[u]){if(us[u].h!=hs(p))return loginV('שם המשתמש קיים. להפיכה לבעלים הזן את הסיסמה הישנה שלו, או בחר שם אחר');us[u].role='owner';us[u].gname='בעלים'}else us[u]={h:hs(p),role:'owner',gname:'בעלים'};sv('amb_users',us);start(u)}
function start(u){const us=US(),x=us[u];U=u;ROLE=x.role;IMP=false;PERM='full';AIM=[];
if(ROLE=='owner'){OWNU=u;D=null;DK=null;view='own'}
else if(ROLE=='sub'){const pg=us[x.parent];if(!pg)return loginV('הגמ״ח של משתמש זה אינו קיים עוד');DK=x.parent;PERM=x.perm||'view';D=ld('amb_d_'+DK)||defD(pg.gname);view='dash'}
else{DK=u;D=ld('amb_d_'+u)||defD(x.gname);view='dash'}idle();shell();autoBk()}
function logout(){if(SRV&&TOK){api('POST','/api/logout').catch(()=>{});TOK=null;sv('amb_tok',null)}clearInterval(POLLT);clearTimeout(PUSHT);unsub('');MY=[];TM={};TH=[];PEND=[];IBS=null;U=null;D=null;DK=null;ROLE=null;IMP=false;PERM='full';supOpen=false;loginV()}
function shell(){const ow=ROLE=='owner'&&!IMP;if(D&&D.loans&&!D._closed)checkClosed();
const cf=!ow&&D?CFG():null,nv=ow?[['own','ניהול גמחים'],['inbox','פניות לקוחות'],['set','הגדרות']]:[...TABS.filter(([k])=>!cf.off[k]).map(([k,n])=>[k,cf.lbl[k]||n]),...(IMP?[['amb','⚙️ AMB מערכות']]:[])];
if(!ow){const vb={card:'list',status:'list',dcard:'deps',dstat:'deps'}[view]||view;if(cf.off[vb]||(view=='amb'&&!IMP))view='dash'}
const rs=document.documentElement.style;if(cf&&/^#[0-9a-fA-F]{6}$/.test(cf.color||'')){rs.setProperty('--pr',cf.color);rs.setProperty('--pr2',cf.color)}else{rs.removeProperty('--pr');rs.removeProperty('--pr2')}

function sched(l){const n=+l.n||0,a=inst(l),pd=paid(l),r=[];let cum=0;for(let k=1;k<=n;k++){const d=addM(l.start,k);const amt=k==n?Math.round((l.amount-a*(n-1))*100)/100:a;cum+=amt;
r.push({k,date:d.slice(0,8)+String(l.day||1).padStart(2,'0'),amount:amt,bal:Math.max(0,l.amount-cum),st:pd+1>=cum?'שולם':d<=today()?'בפיגור':'עתידי'})}return r}
function schedTable(l){const st={'שולם':'var(--ok)','בפיגור':'var(--er)','עתידי':'var(--mu)'};return `<table><tr><th>#</th><th>תאריך</th><th>תשלום</th><th>יתרה אחרי</th><th>סטטוס</th></tr>${sched(l).map(x=>`<tr><td>${x.k}</td><td>${x.date}</td><td>${fm(x.amount)}</td><td>${fm(x.bal)}</td><td style="color:${st[x.st]}">${x.st}</td></tr>`).join('')}</table>`}

const ps=(l.pays||[]).filter(p=>p.date.startsWith(mo)),got=ps.filter(p=>!p.ret).reduce((a,p)=>a+ +p.amount,0),rt=ps.filter(p=>p.ret).length;if(!inR&&!got&&!rt)return;

function bankV(){return `<div class="card"><h3>העלאת דף בנק חודשי</h3><p style="color:var(--mu)">קובץ אקסל/CSV מהבנק. המערכת מזהה לווים ומפקידים לפי מספר זהות או שם בשורה, ותציע התאמות לאישור.</p><input type="file" accept=".xlsx,.xls,.csv" onchange="readBank(this.files[0])"></div><div id="bk">${bk?bkH():''}</div>`}
function readBank(f){if(!f)return;if(!window.XLSX)return alert('ספריית האקסל עדיין נטענת, נסה שוב בעוד רגע');const r=new FileReader();r.onload=e=>{const w=XLSX.read(e.target.result,{type:'array'}),j=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,raw:false,defval:''});bk={file:f.name,items:[]};

j.forEach(row=>{const t=row.join(' ').replace(/\s+/g,' ');const l=D.loans.filter(active).find(x=>hit(x,t)),d0=l?DP().find(x=>+x.mAmt>0&&pkey(x)==pkey(l)):null,d=d0||(l?null:DP().find(x=>+x.mAmt>0&&hit(x,t)));if(!l&&!d)return;

const la=l?(d?Math.min(am,li):am):0,da=Math.round((am-la)*100)/100;
const dm=t.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);let dt=today();if(dm){let y=dm[3].length==2?'20'+dm[3]:dm[3];dt=`${y}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`}
const dup=(l&&la&&(l.pays||[]).some(p=>p.date==dt&&Math.abs(p.amount-la)<1))||(d&&da&&(d.txs||[]).some(x=>x.date==dt&&Math.abs(x.amount-da)<1));
bk.items.push({lid:l&&l.id,did:d&&d.id,nm:(l||d).first+' '+(l||d).last,amount:am,la,da,date:dt,ok:true,dup})});$('#bk').innerHTML=bkH()};r.readAsArrayBuffer(f)}

function gem(n){const L=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];let s='';

<h3>פירוט חודשי ${y}</h3><table><tr><th>חודש</th><th>הלוואות שניתנו</th><th>החזרים</th><th>הפקדות</th><th>משיכות</th><th>תזרים נטו</th></tr>${a.mo.map(r=>`<tr><td>${moName(r.m)}</td><td>${fm(r.la)}</td><td>${fm(r.rp)}</td><td>${fm(r.di)}</td><td>${fm(r.do)}</td><td class="${r.rp+r.di-r.la-r.do>=0?'ok':'er'}">${fm(r.rp+r.di-r.la-r.do)}</td></tr>`).join('')}<tr class="tot"><td>סה״כ</td><td>${fm(a.la)}</td><td>${fm(a.rp)}</td><td>${fm(a.di)}</td><td>${fm(a.do)}</td><td>${fm(a.rp+a.di-a.la-a.do)}</td></tr></table>`;
const h=docShell(D.gname+' – דוח שנתי '+y,'הופק '+today()+' · '+hdate(),[['הלוואות שניתנו',a.ln+' · '+fm(a.la)],['החזרים שנגבו',fm(a.rp)],['הפקדות',fm(a.di)],['מפקידים חדשים',a.nd],['הלוואות שנסגרו',a.cl]],body);pv('דוח שנתי '+y,h,'דוח_שנתי_'+y+'.html',h)}

function bellCount(){if(!D||!D.loans)return 0;return alerts().length+((CDB||SRV)?myList().filter(m=>m.fr=='o'&&m.t>rdGet(DK)).length:0)}
function bellOpen(){const al=alerts(),sup=(CDB||SRV)?myList().filter(m=>m.fr=='o'&&m.t>rdGet(DK)).length:0;
modal(`🔔 התראות (${al.length+sup})`,`${sup?`<div class="al" style="cursor:pointer" onclick="mdX();supOpen=true;supMount();chatRender()">💬 ${sup} הודעות חדשות משירות הלקוחות</div>`:''}${al.map(a=>`<div class="al ${a[0]}" style="cursor:pointer" onclick="mdX();${a[2]?`openL('${a[2]}')`:`go('tasks')`}">${a[1]}</div>`).join('')||'<p style="color:var(--ok)">הכל תקין ✓</p>'}${D.loans.some(l=>active(l)&&late(l))?'<p><button onclick="mdX();bulkWa()">📲 תזכורת בוואטסאפ לכל הלווים בפיגור</button></p>':''}`)}

/* ---------- הגדרות ---------- */
function set(){const ad=canAdmin(),ae=(D&&D.ae)||{},ck=(k,t)=>`<label class="row"><input type="checkbox" id="ae_${k}" ${ae[k]===false?'':'checked'}> ${t}</label>`;
const pc=(k,t)=>`<label class="row"><input type="checkbox" ${P[k]?'checked':''} onchange="setP('${k}',this.checked)"> ${t}</label>`;
const us=US(),subs=ad?Object.entries(us).filter(([k,x])=>x.role=='sub'&&x.parent==DK):[];
let h='';
if(ad)h+=`<div class="card"><h3>הגדרות גמ״ח</h3><div class="sec"><div><label for="gn">שם הגמ״ח</label><input id="gn" value="${esc(D.gname)}"></div><div><label for="gb">מזומן בגמ״ח בתחילת העבודה במערכת (₪)</label><input id="gb" inputmode="numeric" oninput="mi(this)" value="${cm(D.base)}"></div></div></div>
<div class="card"><h3>התראות למייל</h3><label for="gm">כתובת המייל של הגמ״ח</label><input id="gm" type="email" value="${esc(D.email||'')}"><div>${ck('ret','תשלומים שחזרו')}${ck('late','לווים בפיגור')}${ck('miss','פרטים חסרים')}${ck('task','משימות ותזכורות שהגיע זמנן')}</div><p style="color:var(--mu);font-size:13px">בלוח הבקרה יופיע כפתור "שלח התראות למייל" שפותח הודעה מוכנה בתוכנת המייל שלך. שליחה אוטומטית ברקע, גם כשהמערכת סגורה, דורשת שרת והיא חלק מהשלב הבא.</p><button onclick="saveSet()">שמירת הגדרות הגמ״ח</button></div>
${SRV?srvStaffCard()+'<div hidden>':''}<div class="card"><h3>משתמשים והרשאות</h3><p style="color:var(--mu);font-size:13px;margin-top:-6px">הוסף אנשי צוות שייכנסו עם שם משתמש וסיסמה משלהם לגמ״ח הזה.</p><div class="tw"><table><tr><th>שם</th><th>שם משתמש</th><th>הרשאה</th><th></th></tr>${subs.map(([k,x],i)=>`<tr><td>${esc(x.name||'')}</td><td>${esc(k)}</td><td><select onchange="subPerm('${esc(k)}',this.value)" style="width:auto">${Object.entries(PERMS).map(([p,t])=>`<option value="${p}" ${x.perm==p?'selected':''}>${t}</option>`).join('')}</select></td><td><input id="sp${i}" placeholder="סיסמה חדשה" style="width:130px"> <button class="g" onclick="subPw('${esc(k)}',${i})">איפוס</button> <button class="g" onclick="subDel('${esc(k)}')">הסרה</button></td></tr>`).join('')||'<tr><td colspan="4" style="color:var(--mu)">אין משתמשים נוספים</td></tr>'}</table></div>
<div class="sec" style="margin-top:12px"><div><label for="sn">שם מלא</label><input id="sn"></div><div><label for="su">שם משתמש / מייל</label><input id="su" autocapitalize="off"></div><div><label for="sp">סיסמה</label><input id="sp" type="password" autocomplete="new-password"></div><div><label for="sr">הרשאה</label><select id="sr">${Object.entries(PERMS).map(([p,t])=>`<option value="${p}" ${p=='edit'?'selected':''}>${t}</option>`).join('')}</select></div></div><p><button onclick="subAdd()">+ הוספת משתמש</button></p>
<p style="color:var(--mu);font-size:13px"><b>מנהל מלא</b> – הכל כולל הגדרות ומשתמשים · <b>עריכה</b> – עבודה שוטפת ללא הגדרות · <b>צפייה בלבד</b> – רואה נתונים ודוחות, ללא שינויים.</p></div>${SRV?'</div>':''}`;
h+=`<div class="card"><h3>נגישות ותצוגה</h3><div class="sec"><div><label for="th">ערכת צבעים</label><select id="th" onchange="setP('theme',this.value)"><option value="auto" ${P.theme=='auto'?'selected':''}>אוטומטי (לפי המכשיר)</option><option value="light" ${P.theme=='light'?'selected':''}>בהיר</option><option value="dark" ${P.theme=='dark'?'selected':''}>כהה</option></select></div>
<div><label for="fs">גודל טקסט – <span id="pv_fs">${P.fs}%</span></label><input id="fs" type="range" min="85" max="150" step="5" value="${P.fs}" oninput="setP('fs',+this.value)"></div>
<div><label for="brt">בהירות מסך – <span id="pv_br">${P.br}%</span></label><input id="brt" type="range" min="60" max="130" step="5" value="${P.br}" oninput="setP('br',+this.value)"></div></div>
<div class="sec" style="margin-top:6px"><div>${pc('hc','ניגודיות גבוהה')}${pc('big','כפתורים ושדות גדולים (נוח למגע)')}</div><div>${pc('ul','הדגשת קישורים')}${pc('nm','ביטול אנימציות ותנועה')}</div></div>
<p><button class="g" onclick="P={...PDEF};sv('amb_pref',P);applyP();shell()">איפוס לברירת מחדל</button></p><p style="color:var(--mu);font-size:13px">הגדרות התצוגה נשמרות במכשיר הזה.</p></div>
${APP&&!standalone()?`<div class="card"><h3>📱 התקנה כאפליקציה</h3><p style="margin-top:-6px">אפשר להתקין את המערכת על הטלפון, הטאבלט או המחשב ולפתוח אותה מסמל במסך הבית.</p><button id="insB" onclick="installApp()">התקנת האפליקציה</button></div>`:''}<div class="card"><h3>אבטחה וחשבון</h3><p style="margin-top:-6px">מחובר כ: <b>${esc(ME())}</b>${ROLE=='sub'?' · '+PERMS[PERM]:''}</p><div class="sec"><div><label for="op">סיסמה נוכחית</label><input id="op" type="password" autocomplete="current-password"></div><div><label for="np1">סיסמה חדשה</label><input id="np1" type="password" autocomplete="new-password"></div><div><label for="np2">אימות סיסמה חדשה</label><input id="np2" type="password" autocomplete="new-password"></div></div><p><button onclick="SRV?srvChPw():chPw()">שינוי סיסמה</button></p>
<label for="alo">ניתוק אוטומטי לאחר חוסר פעילות</label><select id="alo" style="max-width:260px" onchange="setP('alo',+this.value)">${[[0,'ללא'],[5,'5 דקות'],[15,'15 דקות'],[30,'30 דקות'],[60,'שעה']].map(([v,t])=>`<option value="${v}" ${+P.alo==v?'selected':''}>${t}</option>`).join('')}</select></div>`;
if(ad)h+=applyCard()+ndrCard()+bkCard()+(SRV?auditCard():'');
if(ad){const sz=(()=>{let b=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('amb_'))b+=(k.length+(localStorage.getItem(k)||'').length)*2}}catch(e){}return b})();
h+=`<div class="card"><h3>מידע טכני ותחזוקה</h3><div class="tw"><table>
<tr><td>גרסת מערכת</td><td>${VER}</td></tr><tr><td>אחסון נתונים</td><td>${SRV?'☁️ שרת מאובטח + עותק במכשיר · ':''}דפדפן מקומי (${(sz/1024).toFixed(1)} KB בשימוש)</td></tr>
<tr><td>הלוואות / משימות / מסמכים</td><td>${D.loans.length} / ${T().length} / ${D.loans.reduce((a,l)=>a+(l.docs||[]).length,0)}</td></tr>
<tr><td>צ׳אט שירות לקוחות</td><td>${CDB?'<span style="color:var(--ok)">מחובר – בזמן אמת</span>':'מצב מקומי'}</td></tr>
<tr><td>דף בנק אחרון</td><td>${esc(D.bankLast||'—')}</td></tr><tr><td>מכשיר</td><td>${innerWidth<761?'טלפון':innerWidth<1100?'טאבלט':'מחשב'} (${innerWidth}px)</td></tr></table></div>
<div class="bar" style="margin-top:12px"><button onclick="backup()">גיבוי מלא (קובץ)</button><label class="btn g" style="color:var(--pr)">שחזור מגיבוי<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label><button class="g" onclick="exportX()">ייצוא לווים לאקסל</button><button class="r" onclick="wipe()">מחיקת כל נתוני הגמ״ח</button></div><p style="color:var(--mu);font-size:13px">מומלץ לבצע גיבוי באופן קבוע – הנתונים נשמרים בדפדפן בלבד, וניקוי הדפדפן ימחק אותם.</p></div>`}
return h}
function saveSet(){D.gname=$('#gn').value.trim()||D.gname;D.base=num($('#gb').value);D.email=$('#gm').value.trim();D.ae={};['ret','late','miss','task'].forEach(k=>D.ae[k]=$('#ae_'+k).checked);if(!save())return shell();const us=US();if(us[DK]&&us[DK].role=='gemach'){us[DK].gname=D.gname;sv('amb_users',us)}alert('נשמר');shell()}
function subAdd(){const n=$('#sn').value.trim(),u=$('#su').value.trim().toLowerCase(),p=$('#sp').value,r=$('#sr').value;if(!n||!okU(u)||p.length<4)return alert('נא למלא שם, שם משתמש (ללא רווחים) וסיסמה של 4 תווים לפחות');const us=US();if(us[u])return alert('שם המשתמש תפוס');us[u]={h:hs(p),role:'sub',parent:DK,perm:PERMS[r]?r:'view',name:n};sv('amb_users',us);shell()}
function subPerm(u,r){const us=US();if(us[u]&&us[u].parent==DK){us[u].perm=r;sv('amb_users',us)}}
function subPw(u,i){const p=$('#sp'+i).value;if(p.length<4)return alert('סיסמה: 4 תווים לפחות');const us=US();if(us[u]&&us[u].parent==DK){us[u].h=hs(p);sv('amb_users',us);alert('הסיסמה עודכנה')}}
function subDel(u){if(u==U)return alert('לא ניתן להסיר את המשתמש שמחובר כעת');if(!confirm('להסיר את המשתמש '+u+'?'))return;const us=US();if(us[u]&&us[u].parent==DK){delete us[u];sv('amb_users',us)}shell()}
function chPw(){const us=US(),me=ME(),o=$('#op').value,a=$('#np1').value,b=$('#np2').value;if(!us[me]||us[me].h!=hs(o))return alert('הסיסמה הנוכחית שגויה');if(a.length<4)return alert('סיסמה חדשה: 4 תווים לפחות');if(a!=b)return alert('הסיסמאות אינן תואמות');us[me].h=hs(a);sv('amb_users',us);alert('הסיסמה שונתה');shell()}
const backup=()=>dl('גיבוי_'+(D.gname||'gemach')+'_'+today()+'.json',new TextEncoder().encode(JSON.stringify({amb:VER,date:today(),data:D})));
function restore(f){if(!f)return;const r=new FileReader();r.onload=e=>{try{const j=JSON.parse(e.target.result),d=j.data||j;if(!d||!Array.isArray(d.loans))throw 0;if(!confirm(`לשחזר גיבוי עם ${d.loans.length} הלוואות? הנתונים הנוכחיים יוחלפו.`))return;D={...defD(D.gname),...d};if(save()){alert('השחזור הושלם');go('dash')}}catch(x){alert('קובץ הגיבוי אינו תקין')}};r.readAsText(f)}
function wipe(){if(prompt('למחיקת כל ההלוואות, התשלומים והמשימות של הגמ״ח הקלד: מחק')!=='מחק')return;D=defD(D.gname);if(save())go('dash')}
/* ---------- אפליקציה (PWA) – פעיל רק כשהמערכת מותקנת מהאתר העצמאי ---------- */
const APP=!/claude\.ai|claudeusercontent|anthropic/.test(location.hostname)&&/^https?:$/.test(location.protocol);let INS=null;
if(APP){const m=document.createElement('link');m.rel='manifest';m.href='manifest.webmanifest';document.head.appendChild(m);
[['apple-touch-icon','icons/icon-192.png'],['icon','icons/icon.svg']].forEach(([r,h])=>{const l=document.createElement('link');l.rel=r;l.href=h;document.head.appendChild(l)});
const tc=document.createElement('meta');tc.name='theme-color';tc.content='#1d4ed8';document.head.appendChild(tc);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();INS=e;const b=$('#insB');if(b)b.hidden=false})}
let CANOWN=APP?location.hash=='#admin':!(window.claude&&claude.use);
if(!APP&&window.claude&&claude.use)claude.use('user').then(async u=>{CANOWN=!!(u&&await u.isOwner());if(!U&&$('#login'))loginV()}).catch(()=>{});
if(APP)addEventListener('hashchange',()=>{CANOWN=location.hash=='#admin';if(!U)loginV()});
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone||/AMBGemachApp/.test(navigator.userAgent);
function installApp(){if(INS){INS.prompt();INS.userChoice.finally(()=>{INS=null;const b=$('#insB');if(b)b.hidden=true})}else alert(/iphone|ipad/i.test(navigator.userAgent)?'באייפון: לחץ על כפתור השיתוף בספארי ⟵ "הוסף למסך הבית".':'בדפדפן: פתח את תפריט הדפדפן ⟵ "התקן אפליקציה" / "הוסף למסך הבית".')}
initChat();loginV();initSrv();
</script></body></html>
